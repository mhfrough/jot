# Release: a version tag (v1.0.0) runs the tests and publishes a GitHub release with the web app
# as a zip you can host anywhere. Every file is attached twice: with its version in the name, and
# with a fixed name for links through /releases/latest/download/<name>.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: |
          python3 -m http.server 8190 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fs http://localhost:8190/ >/dev/null && break; sleep 0.5; done
          npm test
      - name: Zip the web app
        run: |
          v=${GITHUB_REF_NAME#v}; [ "$GITHUB_REF_TYPE" = tag ] || v=dev
          mkdir -p out
          zip -qr "out/jot-web-$v.zip" index.html icon.svg apple-touch-icon.png robots.txt sitemap.xml \
            app css js fonts assets privacy terms cookies credits sitemap LICENSE README.md -x 'assets/og.html'
          cp "out/jot-web-$v.zip" out/jot-web.zip
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Jot ${{ github.ref_name }}
          generate_release_notes: true
          files: files/*
